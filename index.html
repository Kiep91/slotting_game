<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Slot the Aisle — Pet Retail Slotting Game</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>html,body{margin:0;padding:0}#root{min-height:100vh}</style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const { useState, useEffect, useRef, useMemo } = React;
  const SPECIES = {
    dog: { label: "Dog", color: "#5b8ef7" },
    cat: { label: "Cat", color: "#f08a3c" },
    bird: { label: "Bird", color: "#4cba6f" },
    fish: { label: "Fish", color: "#35c4c8" },
    small: { label: "Small Animal", color: "#a276f0" },
    reptile: { label: "Reptile", color: "#d95d72" }
  };
  const PRODUCTS = [
    { id: "dogfood", name: "Dog Food 15 kg Bags", species: "dog", weight: 9, crush: 2, velocity: 90 },
    { id: "dogcans", name: "Dog Cans (Case)", species: "dog", weight: 7, crush: 3, velocity: 70 },
    { id: "dogtreats", name: "Dog Treats", species: "dog", weight: 2, crush: 6, velocity: 85 },
    { id: "dogtoys", name: "Dog Toys", species: "dog", weight: 2, crush: 3, velocity: 50 },
    { id: "dogchews", name: "Dog Chews", species: "dog", weight: 3, crush: 4, velocity: 60 },
    { id: "pads", name: "Puppy Pads", species: "dog", weight: 4, crush: 8, velocity: 75 },
    { id: "litter", name: "Cat Litter 18 kg", species: "cat", weight: 10, crush: 2, velocity: 95 },
    { id: "catcans", name: "Cat Cans (Case)", species: "cat", weight: 7, crush: 3, velocity: 80 },
    { id: "catdry", name: "Cat Dry Food Bags", species: "cat", weight: 6, crush: 4, velocity: 75 },
    { id: "cattreats", name: "Cat Treats", species: "cat", weight: 1, crush: 7, velocity: 65 },
    { id: "cattoys", name: "Cat Toys", species: "cat", weight: 1, crush: 5, velocity: 40 },
    { id: "birdseed", name: "Wild Bird Seed 10 kg", species: "bird", weight: 8, crush: 3, velocity: 45 },
    { id: "cages", name: "Bird Cages", species: "bird", weight: 5, crush: 7, velocity: 10 },
    { id: "fishfood", name: "Fish Food", species: "fish", weight: 1, crush: 8, velocity: 30 },
    { id: "aquarium", name: "Aquarium Glass Kits", species: "fish", weight: 6, crush: 10, velocity: 8 },
    { id: "bedding", name: "Small Animal Bedding", species: "small", weight: 3, crush: 6, velocity: 35 },
    { id: "safood", name: "Small Animal Food", species: "small", weight: 3, crush: 5, velocity: 30 },
    { id: "hay", name: "Hay Bales", species: "small", weight: 4, crush: 5, velocity: 25 },
    { id: "lamps", name: "Reptile Heat Lamps", species: "reptile", weight: 2, crush: 9, velocity: 12 },
    { id: "substrate", name: "Reptile Substrate", species: "reptile", weight: 4, crush: 4, velocity: 15 },
    { id: "flea", name: "Flea & Tick Treatments", species: "dog", weight: 1, crush: 6, velocity: 55 },
    { id: "gravel", name: "Aquarium Gravel & D\xE9cor", species: "fish", weight: 7, crush: 3, velocity: 18 },
    { id: "feeders", name: "Bird Feeders", species: "bird", weight: 3, crush: 6, velocity: 28 },
    { id: "sacages", name: "Small Animal Cages", species: "small", weight: 5, crush: 8, velocity: 12 }
  ];
  const byId = Object.fromEntries(PRODUCTS.map((p) => [p.id, p]));
  const AISLES = [1, 2];
  const SIDES = ["A", "B"];
  const BAYS = [1, 2, 3, 4, 5, 6];
  const BAY_M = 4;
  const CROSS_M = 4;
  const AISLE_LEN = BAYS.length * BAY_M;
  const TUNNEL_AFTER_BAY = 3;
  const TUNNEL_M = TUNNEL_AFTER_BAY * BAY_M;
  const CROSS_Z_M = 7;
  const slotId = (aisle, side, bay) => `${aisle}${side}-${String(bay).padStart(2, "0")}`;
  const ALL_SLOTS = [];
  AISLES.forEach((a) => SIDES.forEach((s) => BAYS.forEach((b) => ALL_SLOTS.push({ id: slotId(a, s, b), aisle: a, side: s, bay: b }))));
  const slotById = Object.fromEntries(ALL_SLOTS.map((s) => [s.id, s]));
  function pathDist(slot) {
    const along = slot.bay * BAY_M;
    if (slot.aisle === 1) return along;
    const viaTunnel = TUNNEL_M + CROSS_Z_M + Math.abs(along - TUNNEL_M);
    const viaFarEnd = AISLE_LEN + CROSS_M + CROSS_Z_M + (AISLE_LEN + CROSS_M - along);
    return Math.min(viaTunnel, viaFarEnd);
  }
  const SLOT_DISTS = ALL_SLOTS.map(pathDist).sort((a, b) => a - b);
  const clamp = (v) => Math.max(0, Math.min(100, Math.round(v)));
  function parseAssignments(assignments) {
    const loc = {};
    Object.entries(assignments).forEach(([sid, pid]) => {
      if (pid) loc[pid] = slotById[sid];
    });
    return loc;
  }
  function distanceScore(loc, metricKey) {
    const actual = PRODUCTS.reduce((s, p) => s + p[metricKey] * pathDist(loc[p.id]), 0);
    const vals = PRODUCTS.map((p) => p[metricKey]).sort((a, b) => b - a);
    let best = 0, worst = 0;
    vals.forEach((v, i) => {
      best += v * SLOT_DISTS[i];
      worst += v * SLOT_DISTS[SLOT_DISTS.length - 1 - i];
    });
    return { actual, score: clamp(100 * (worst - actual) / (worst - best)) };
  }
  function scoreTravel(loc) {
    const { score } = distanceScore(loc, "velocity");
    const offenders = PRODUCTS.filter((p) => p.velocity >= 70 && pathDist(loc[p.id]) >= 24).sort((a, b) => b.velocity - a.velocity).map((p) => `${p.name} (${p.velocity} picks/day) sits ${pathDist(loc[p.id])} m out \u2014 a long walk on most orders`);
    return { score, offenders };
  }
  function scoreHandling(loc) {
    const { score } = distanceScore(loc, "weight");
    const offenders = PRODUCTS.filter((p) => p.weight >= 7 && pathDist(loc[p.id]) >= 24).sort((a, b) => b.weight - a.weight).map((p) => `${p.name} (${p.weight}/10 weight) is carried ${pathDist(loc[p.id])} m back to the dock every time`);
    return { score, offenders };
  }
  function scoreDamage(loc) {
    const heavies = PRODUCTS.filter((p) => p.weight >= 6);
    const crushables = PRODUCTS.filter((p) => p.crush >= 6);
    let maxViol = 0, viol = 0;
    const pairs = [];
    heavies.forEach((h) => {
      crushables.forEach((c) => {
        if (h.id === c.id) return;
        const sev = (h.weight - 5) * (c.crush - 5);
        maxViol += sev;
        const dh = pathDist(loc[h.id]), dc = pathDist(loc[c.id]);
        if (dh > dc) {
          viol += sev;
          pairs.push({ sev, txt: `${c.name} is picked before ${h.name} \u2014 ${h.name} lands on top of it in the cart` });
        } else if (dh === dc) {
          viol += sev / 2;
        }
      });
    });
    pairs.sort((a, b) => b.sev - a.sev);
    return { score: maxViol === 0 ? 100 : clamp(100 * (1 - viol / maxViol)), offenders: pairs.slice(0, 3).map((p) => p.txt) };
  }
  function scoreSpecies(loc) {
    let total = 0;
    const loners = [];
    PRODUCTS.forEach((p) => {
      const s = loc[p.id];
      const neigh = [];
      [s.bay - 1, s.bay + 1].forEach((b) => {
        if (b >= 1 && b <= BAYS.length) neigh.push(slotId(s.aisle, s.side, b));
      });
      neigh.push(slotId(s.aisle, s.side === "A" ? "B" : "A", s.bay));
      const occupied = neigh.map((nid) => Object.entries(loc).find(([, sl]) => sl.id === nid)).filter(Boolean);
      if (occupied.length === 0) return;
      const same = occupied.filter(([pid]) => byId[pid].species === p.species).length;
      total += same / occupied.length;
      if (same === 0) loners.push(`${p.name} has no ${SPECIES[p.species].label.toLowerCase()} neighbours \u2014 replenishment and store pallets both suffer`);
    });
    return { score: clamp(total / PRODUCTS.length / 0.7 * 100), offenders: loners.slice(0, 4) };
  }
  function computeScores(assignments) {
    const loc = parseAssignments(assignments);
    const travel = scoreTravel(loc);
    const handling = scoreHandling(loc);
    const damage = scoreDamage(loc);
    const species = scoreSpecies(loc);
    const total = Math.round(travel.score * 0.35 + damage.score * 0.25 + handling.score * 0.2 + species.score * 0.2);
    const grade = total >= 90 ? "S" : total >= 80 ? "A" : total >= 70 ? "B" : total >= 55 ? "C" : "D";
    return { travel, handling, damage, species, total, grade };
  }
  function sampleOrder(n = 8) {
    const pool = [...PRODUCTS];
    const picks = [];
    while (picks.length < n && pool.length) {
      const totalV = pool.reduce((s, p) => s + p.velocity, 0);
      let r = Math.random() * totalV, idx = 0;
      for (let i = 0; i < pool.length; i++) {
        r -= pool[i].velocity;
        if (r <= 0) {
          idx = i;
          break;
        }
      }
      picks.push(pool[idx].id);
      pool.splice(idx, 1);
    }
    return picks;
  }
  const AISLE_Z = { 1: 0, 2: 7 };
  const RACK_Z = { "1A": -3, "1B": 3, "2A": 4, "2B": 10 };
  const bayX = (bay) => (bay - 1) * BAY_M + BAY_M / 2;
  const DOCK_X = -3;
  const FAR_X = AISLE_LEN + 2;
  const TUNNEL_X = TUNNEL_M;
  const TUNNEL_W = 2.6;
  const MIDBLOCK = [RACK_Z["1B"], RACK_Z["2A"]];
  function ThreeSim({ assignments, onDone }) {
    const mountRef = useRef(null);
    const [hud, setHud] = useState({ picked: 0, total: 0, dist: 0, current: "Leaving the dock", aisle: 1, route: "\u2014" });
    const [webglFailed, setWebglFailed] = useState(false);
    const doneRef = useRef(false);
    useEffect(() => {
      const mount = mountRef.current;
      if (!mount) return;
      const W = mount.clientWidth || 800, H = mount.clientHeight || 520;
      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "default" });
      } catch (e) {
        console.error("WebGL unavailable:", e);
        setWebglFailed(true);
        return;
      }
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(1119e3);
      scene.fog = new THREE.Fog(1119e3, 28, 70);
      const camera = new THREE.PerspectiveCamera(52, W / H, 0.1, 140);
      renderer.setSize(W, H);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      mount.appendChild(renderer.domElement);
      scene.add(new THREE.AmbientLight(16777215, 0.6));
      const sun = new THREE.DirectionalLight(16774102, 0.85);
      sun.position.set(6, 22, -6);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, { left: -30, right: AISLE_LEN + 20, top: 40, bottom: -20 });
      sun.shadow.camera.updateProjectionMatrix();
      scene.add(sun);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(120, 90), new THREE.MeshStandardMaterial({ color: 1908774, roughness: 0.95 }));
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);
      const paint = new THREE.MeshStandardMaterial({ color: 15907085 });
      const stripe = (w, d, x, z) => {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, 0.02, d), paint);
        m.position.set(x, 0.011, z);
        scene.add(m);
      };
      [-2.1, 2.1].forEach((dz) => stripe(AISLE_LEN + 4, 0.12, AISLE_LEN / 2, AISLE_Z[1] + dz));
      [-2.1, 2.1].forEach((dz) => stripe(AISLE_LEN + 4, 0.12, AISLE_LEN / 2, AISLE_Z[2] + dz));
      stripe(0.12, AISLE_Z[2] - AISLE_Z[1] + 4, FAR_X + 0.6, (AISLE_Z[1] + AISLE_Z[2]) / 2);
      stripe(0.15, 4.2, DOCK_X, 0);
      const steel = new THREE.MeshStandardMaterial({ color: 3752527, roughness: 0.6, metalness: 0.4 });
      const beamMat = new THREE.MeshStandardMaterial({ color: 13199915, roughness: 0.5, metalness: 0.3 });
      Object.values(RACK_Z).forEach((z) => {
        const isMid = MIDBLOCK.includes(z);
        for (let x = 0; x <= AISLE_LEN; x += BAY_M) {
          if (isMid && Math.abs(x - TUNNEL_X) < 0.01) continue;
          const up = new THREE.Mesh(new THREE.BoxGeometry(0.14, 3.2, 0.9), steel);
          up.position.set(x, 1.6, z);
          up.castShadow = true;
          scene.add(up);
        }
        [1.7, 3.05].forEach((y) => {
          if (isMid) {
            const gapL = TUNNEL_X - TUNNEL_W / 2, gapR = TUNNEL_X + TUNNEL_W / 2;
            [[0, gapL], [gapR, AISLE_LEN]].forEach(([x0, x1]) => {
              const beam = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, 0.12, 0.9), beamMat);
              beam.position.set((x0 + x1) / 2, y, z);
              scene.add(beam);
            });
          } else {
            const beam = new THREE.Mesh(new THREE.BoxGeometry(AISLE_LEN, 0.12, 0.9), beamMat);
            beam.position.set(AISLE_LEN / 2, y, z);
            scene.add(beam);
          }
        });
      });
      const lintel = new THREE.Mesh(new THREE.BoxGeometry(TUNNEL_W, 0.16, MIDBLOCK[1] - MIDBLOCK[0] + 0.9), beamMat);
      lintel.position.set(TUNNEL_X, 3.05, (MIDBLOCK[0] + MIDBLOCK[1]) / 2);
      lintel.castShadow = true;
      scene.add(lintel);
      [-TUNNEL_W / 2, TUNNEL_W / 2].forEach((dx) => {
        const edge = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.02, MIDBLOCK[1] - MIDBLOCK[0] + 3), paint);
        edge.position.set(TUNNEL_X + dx, 0.011, (MIDBLOCK[0] + MIDBLOCK[1]) / 2);
        scene.add(edge);
      });
      const slotMeshes = {};
      Object.entries(assignments).forEach(([sid, pid]) => {
        if (!pid) return;
        const s = slotById[sid], p = byId[pid];
        const size = 0.75 + p.weight * 0.07;
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(size * 1.25, size, 0.85),
          new THREE.MeshStandardMaterial({ color: new THREE.Color(SPECIES[p.species].color), roughness: 0.7 })
        );
        mesh.position.set(bayX(s.bay), size / 2, RACK_Z[`${s.aisle}${s.side}`]);
        mesh.castShadow = true;
        scene.add(mesh);
        slotMeshes[pid] = mesh;
      });
      const picker = new THREE.Group();
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.38, 1.15, 12), new THREE.MeshStandardMaterial({ color: 14147632, roughness: 0.6 }));
      body.position.y = 0.85;
      body.castShadow = true;
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.26, 16, 12), new THREE.MeshStandardMaterial({ color: 14263929 }));
      head.position.y = 1.7;
      head.castShadow = true;
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.12, 12), new THREE.MeshStandardMaterial({ color: 2845872 }));
      cap.position.y = 1.88;
      picker.add(body, head, cap);
      picker.position.set(DOCK_X, 0, 0);
      scene.add(picker);
      const cart = new THREE.Group();
      const bed = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.12, 0.9), steel);
      bed.position.y = 0.35;
      cart.add(bed);
      [-0.5, 0.5].forEach((x) => [-0.34, 0.34].forEach((z) => {
        const w = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.08, 10), new THREE.MeshStandardMaterial({ color: 1316378 }));
        w.rotation.x = Math.PI / 2;
        w.position.set(x, 0.12, z);
        cart.add(w);
      }));
      cart.position.set(DOCK_X - 1.5, 0, 0);
      scene.add(cart);
      const loc = parseAssignments(assignments);
      const order = sampleOrder(10).filter((pid) => loc[pid]);
      const a1 = order.filter((pid) => loc[pid].aisle === 1).sort((x, y) => loc[x].bay - loc[y].bay);
      const a2 = order.filter((pid) => loc[pid].aisle === 2);
      const CROSS_Z = AISLE_Z[2] - AISLE_Z[1];
      const deepest = (list) => list.length ? Math.max(...list.map((pid) => bayX(loc[pid].bay))) : DOCK_X;
      const d1 = deepest(a1), d2 = deepest(a2);
      const farCost = 2 * (FAR_X - DOCK_X) + 2 * CROSS_Z;
      const t1 = Math.max(d1, TUNNEL_X), t2 = Math.max(d2, TUNNEL_X);
      const tunnelCost = t1 - DOCK_X + (t1 - TUNNEL_X) + CROSS_Z + (t2 - TUNNEL_X) + (t2 - DOCK_X) + CROSS_Z;
      const useTunnel = a2.length > 0 && tunnelCost <= farCost;
      const route = [];
      const push = (x, z, pick, aisle, note) => route.push({ x, z, pick, aisle, note });
      const pickWp = (pid, aisle) => push(bayX(loc[pid].bay), AISLE_Z[aisle], pid, aisle);
      if (!a2.length) {
        a1.forEach((pid) => pickWp(pid, 1));
        push(DOCK_X, AISLE_Z[1], null, 1, "Heading back to the dock");
      } else if (useTunnel) {
        a1.forEach((pid) => pickWp(pid, 1));
        push(TUNNEL_X, AISLE_Z[1], null, 1, "Cutting through the tunnel");
        push(TUNNEL_X, AISLE_Z[2], null, 2, "Into aisle 2");
        a2.filter((pid) => bayX(loc[pid].bay) > TUNNEL_X).sort((x, y) => loc[x].bay - loc[y].bay).forEach((pid) => pickWp(pid, 2));
        a2.filter((pid) => bayX(loc[pid].bay) < TUNNEL_X).sort((x, y) => loc[y].bay - loc[x].bay).forEach((pid) => pickWp(pid, 2));
        push(DOCK_X, AISLE_Z[2], null, 2, "Heading back to the dock");
        push(DOCK_X, AISLE_Z[1], null, 1, null);
      } else {
        a1.forEach((pid) => pickWp(pid, 1));
        push(FAR_X, AISLE_Z[1], null, 1, "Crossing at the far end");
        push(FAR_X, AISLE_Z[2], null, 2, "Into aisle 2");
        a2.sort((x, y) => loc[y].bay - loc[x].bay).forEach((pid) => pickWp(pid, 2));
        push(DOCK_X, AISLE_Z[2], null, 2, "Heading back to the dock");
        push(DOCK_X, AISLE_Z[1], null, 1, null);
      }
      const totalPicks = a1.length + a2.length;
      setHud((h) => ({ ...h, total: totalPicks, route: useTunnel ? "Tunnel" : a2.length ? "Far end" : "Aisle 1 only" }));
      let wp = 0, mode = "walk", pickT = 0, cartStack = 0, dist = 0, picked = 0;
      const SPEED = 3.4;
      const BED_TOP = 0.41;
      const COL_X = [-0.36, 0, 0.36];
      const colTop = [BED_TOP, BED_TOP, BED_TOP];
      const boxH = (m) => (m.geometry.parameters.height || 0.8) * m.scale.y;
      const heading = new THREE.Vector3(1, 0, 0);
      const clock = new THREE.Clock();
      let raf;
      function animate() {
        raf = requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const target = route[Math.min(wp, route.length - 1)];
        if (mode === "walk") {
          const dx = target.x - picker.position.x;
          const dz = target.z - picker.position.z;
          const d = Math.hypot(dx, dz);
          const step = SPEED * dt;
          if (d <= step + 1e-6) {
            picker.position.set(target.x, 0, target.z);
            if (target.pick) {
              mode = "pick";
              pickT = 0;
              setHud((h) => ({ ...h, aisle: target.aisle, current: `Picking ${byId[target.pick].name} \u2014 ${loc[target.pick].id}` }));
            } else {
              if (target.note) setHud((h) => ({ ...h, aisle: target.aisle, current: target.note }));
              wp++;
              if (wp >= route.length && !doneRef.current) {
                doneRef.current = true;
                setTimeout(() => onDone(Math.round(dist)), 500);
              }
            }
          } else {
            const ux = dx / d, uz = dz / d;
            picker.position.x += ux * step;
            picker.position.z += uz * step;
            picker.position.y = Math.abs(Math.sin(clock.elapsedTime * 9)) * 0.05;
            dist += step;
            heading.lerp(new THREE.Vector3(ux, 0, uz), 0.12).normalize();
          }
        } else if (mode === "pick") {
          pickT += dt;
          const mesh = slotMeshes[target.pick];
          if (mesh) {
            const t = Math.min(pickT / 0.8, 1);
            const ease = t * t * (3 - 2 * t);
            const from = mesh.userData.from || (mesh.userData.from = mesh.position.clone());
            const col = cartStack % 3;
            const h = boxH(mesh) * 0.55;
            const to = new THREE.Vector3(
              cart.position.x + heading.x * COL_X[col],
              colTop[col] + h / 2,
              cart.position.z + heading.z * COL_X[col]
            );
            mesh.position.lerpVectors(from, to, ease);
            mesh.scale.setScalar(1 - 0.45 * ease);
          }
          if (pickT >= 1) {
            if (mesh) {
              const col = cartStack % 3;
              const h = boxH(mesh);
              cart.attach(mesh);
              mesh.position.set(COL_X[col], colTop[col] + h / 2, 0);
              mesh.rotation.set(0, 0, 0);
              colTop[col] += h + 0.015;
            }
            cartStack++;
            picked++;
            wp++;
            setHud((h) => ({ ...h, picked, current: picked < totalPicks ? "Walking to next face" : "Order complete" }));
            mode = "walk";
          }
        }
        setHud((h) => Math.abs(h.dist - dist) > 0.5 ? { ...h, dist } : h);
        const cartTarget = new THREE.Vector3(picker.position.x - heading.x * 1.6, 0, picker.position.z - heading.z * 1.6);
        cart.position.lerp(cartTarget, Math.min(dt * 4.5, 1));
        cart.rotation.y = Math.atan2(heading.x, heading.z) - Math.PI / 2;
        const camPos = new THREE.Vector3(
          picker.position.x - heading.x * 7.5 - heading.z * 1.5,
          5,
          picker.position.z - heading.z * 7.5 + heading.x * 1.5
        );
        camera.position.lerp(camPos, 0.05);
        camera.lookAt(picker.position.x + heading.x * 5, 1.1, picker.position.z + heading.z * 5);
        renderer.render(scene, camera);
      }
      animate();
      const onResize = () => {
        const w = mount.clientWidth, h = mount.clientHeight;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      };

:root{--bg:#15171c;--panel:#1e222a;--panel2:#242933;--line:#343c49;--accent:#f2b90d;--text:#eceada;--dim:#98a1b0}
*{box-sizing:border-box}
.app{min-height:100vh;background:repeating-linear-gradient(90deg,transparent 0 119px,rgba(255,255,255,.015) 119px 120px),var(--bg);
  color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 22px;border-bottom:2px solid var(--accent)}
.hdr-left{display:flex;align-items:center;gap:14px}
.logo-mark{font-family:ui-monospace,Menlo,monospace;background:var(--accent);color:#15171c;font-weight:800;padding:8px 10px;font-size:14px;
  letter-spacing:1px;clip-path:polygon(0 0,100% 0,100% 70%,85% 100%,0 100%)}
h1{margin:0;font-size:20px;letter-spacing:3px;font-weight:800}
.sub{margin:2px 0 0;font-size:12px;color:var(--dim)}
.hdr-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;font-weight:600;padding:9px 14px;border-radius:3px;cursor:pointer;border:1px solid var(--line);
  background:var(--panel);color:var(--text);letter-spacing:.3px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:#15171c;border-color:var(--accent);font-weight:800}
.btn.primary:disabled{background:var(--panel2);color:var(--dim);border-color:var(--line);cursor:not-allowed}
.btn.ghost{background:transparent}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;padding:14px 22px;background:var(--panel);
  border-bottom:1px solid var(--line);font-size:12.5px;color:var(--dim);line-height:1.45}
.rules b{color:var(--accent);display:block;margin-bottom:3px;letter-spacing:.5px}
.body{display:flex;flex:1;align-items:stretch;flex-wrap:wrap}
.tray{width:300px;min-width:260px;flex-shrink:0;border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;
  max-height:calc(100vh - 90px);overflow-y:auto}
.tray-head{display:flex;justify-content:space-between;align-items:baseline}
.tray-title{font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:700}
.tray-count{font-size:11px;color:var(--accent);font-family:ui-monospace,monospace}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;align-items:center;gap:8px;text-align:left;font:inherit;font-size:12.5px;background:var(--panel);border:1px solid var(--line);
  color:var(--text);padding:7px 9px;border-radius:3px;cursor:pointer}
.chip:hover{border-color:var(--sp)}
.chip.sel{border-color:var(--sp);background:var(--panel2);box-shadow:0 0 0 1px var(--sp)}
.chip.slotted{opacity:.32}
.chip-bar{width:4px;height:22px;background:var(--sp);flex-shrink:0;border-radius:1px}
.chip-name{flex:1;font-weight:600}
.chip-stats{display:flex;gap:7px;font-family:ui-monospace,monospace;font-size:10.5px;color:var(--dim)}
.chip-stats b{font-weight:500}
.sel-card{background:var(--panel2);border:1px solid var(--sp);border-left:4px solid var(--sp);padding:10px 12px;border-radius:3px}
.sel-name{font-weight:700;margin-bottom:6px}
.sel-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim);margin:3px 0}
.sel-hint{margin-top:7px;font-size:11px;color:var(--accent);letter-spacing:.5px}
.dots{display:flex;gap:3px}
.dot{width:9px;height:9px;border-radius:1px;background:var(--line)}
.dot.on{background:var(--sp,var(--accent))}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.leg{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:5px}
.leg i{width:10px;height:10px;border-radius:2px;display:inline-block}
.racks{flex:1;min-width:340px;padding:16px 20px;overflow-x:auto}
.aisle{margin-bottom:22px}
.aisle-head{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.aisle-tag{font-family:ui-monospace,monospace;font-size:11px;background:var(--accent);color:#15171c;font-weight:800;padding:3px 8px;letter-spacing:1px}
.aisle-dir{font-size:11px;color:var(--dim);letter-spacing:.5px}
.dist-strip,.rack-row{display:grid;grid-template-columns:74px repeat(3,1fr) 30px repeat(3,1fr);gap:6px;margin-bottom:6px}
.bay-marker{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--accent);text-align:center;border-top:2px solid var(--accent);padding-top:3px}
.lvl-tag{font-family:ui-monospace,monospace;font-size:10px;color:var(--dim);display:flex;align-items:center;justify-content:center;
  border:1px dashed var(--line);border-radius:3px;letter-spacing:1px}
.lvl-tag.ghosted{border:none}
.slot{position:relative;min-height:74px;border:1px solid var(--line);background:var(--panel);border-radius:3px;padding:7px 9px;text-align:left;
  font:inherit;color:var(--text);cursor:pointer;display:flex;flex-direction:column;gap:3px}
.slot.target:not(.full){border-style:dashed;border-color:var(--accent)}
.slot:hover{border-color:var(--accent)}
.slot.full{border-left:4px solid var(--sp);background:var(--panel2)}
.slot-code{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--accent);letter-spacing:.5px}
.slot-name{font-size:12px;font-weight:700;line-height:1.2}
.slot-meta{font-family:ui-monospace,monospace;font-size:10px;color:var(--dim)}
.slot-empty{font-size:11px;color:var(--dim);font-style:italic;margin:auto 0}
.tunnel-col{display:flex;align-items:center;justify-content:center;font-family:ui-monospace,monospace;font-size:8px;
  letter-spacing:1px;color:var(--dim);writing-mode:vertical-rl;text-orientation:mixed;border-left:1px dashed var(--line);
  border-right:1px dashed var(--line);border-radius:2px}
.tunnel-col.open{color:var(--accent);border-color:var(--accent);background:rgba(242,185,13,.07)}
.tunnel-col.head{border:none;color:var(--accent);font-size:12px;writing-mode:horizontal-tb}
.foot-note{font-size:11.5px;color:var(--dim);margin-top:4px}
.simwrap{flex:1;min-height:520px;height:calc(100vh - 90px)}
.hud{position:absolute;top:14px;left:14px;background:rgba(21,23,28,.85);border:1px solid var(--line);border-left:4px solid var(--accent);
  padding:10px 14px;border-radius:3px;backdrop-filter:blur(4px)}
.hud-line{font-family:ui-monospace,monospace;font-size:13px;margin-bottom:3px}
.hud-label{color:var(--accent);font-size:10px;letter-spacing:1.5px;margin-right:8px}
.hud-current{font-size:12px;color:var(--dim);max-width:260px}
.skip{position:absolute;bottom:16px;right:16px}
.webgl-fail{display:flex;align-items:center;justify-content:center;height:100%;padding:24px}
.webgl-fail-card{max-width:420px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);padding:20px;
  border-radius:3px;font-size:13.5px;line-height:1.5;color:var(--dim)}
.webgl-fail-card b{color:var(--text);display:block;margin-bottom:6px;font-size:15px}
.webgl-fail-card .btn{margin-top:12px}
.results{max-width:760px;margin:0 auto;padding:30px 22px;width:100%}
.score-hero{display:flex;align-items:center;gap:22px;margin-bottom:26px}
.grade{font-size:64px;font-weight:900;width:110px;height:110px;display:flex;align-items:center;justify-content:center;border:3px solid var(--accent);
  color:var(--accent);clip-path:polygon(0 0,100% 0,100% 78%,78% 100%,0 100%)}
.grade[data-g="C"],.grade[data-g="D"]{border-color:#d95d72;color:#d95d72}
.total{font-size:44px;font-weight:800;font-family:ui-monospace,monospace}
.total span{font-size:18px;color:var(--dim)}
.total-sub{font-size:13px;color:var(--dim)}
.bar-block{margin-bottom:20px}
.bar-head{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:5px}
.bar-head em{font-style:normal;color:var(--dim);font-weight:500;font-size:11.5px}
.bar-head b{font-family:ui-monospace,monospace}
.bar{height:10px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
